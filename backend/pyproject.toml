[tool.poetry]
package-mode = false

[project]
name = "stegchat-backend"
version = "0.1.0"
description = "Backend for StegChat – modular monolith"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "python-dotenv",
    "ruff",
    "pytest",
    "mypy",
    "argon2-cffi",
    "cryptography",
    "pillow",
    "numpy",
    "scikit-learn",
    "joblib",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "python-dotenv",
    "ruff",
    "pytest",
    "mypy",
    "argon2-cffi",
    "bcrypt",
    "python-multipart",
    "pydantic-settings (>=2.16.2,<3.0.0)"
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W293", "W291", "E712", "E711", "F841", "E402", "E702", "F401"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true